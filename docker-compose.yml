name: aevra

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aevra
      POSTGRES_USER: aevra
      POSTGRES_PASSWORD: aevra
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevra -d aevra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    # Optional storage profile. The default development/staging path uses local media storage.
    profiles: ["storage"]
    command: server /data --console-address :9001
    environment:
      # Keep the console root credentials aligned with the API S3 credentials.
      # MINIO_* takes precedence when explicitly supplied; the AEVRA_* aliases
      # make the setup work with the same values used by the API service.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-${AEVRA_MINIO_ACCESS_KEY:-aevra}}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-${AEVRA_MINIO_SECRET_KEY:-aevra-development-only}}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]

  aistor:
    image: quay.io/minio/aistor/minio:latest
    # Optional licensed AIStor Free profile. Keep the license file outside Git.
    profiles: [aistor]
    command: ["server", "/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      # AIStor reads these only while the aistor_data volume is initialized.
      # Keep them aligned with AEVRA_MINIO_* so the console and API agree.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-${AEVRA_MINIO_ACCESS_KEY:-aevra}}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-${AEVRA_MINIO_SECRET_KEY:-aevra-development-only}}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes:
      - "aistor_data:/data"
      - "./infrastructure/secrets/minio.license:/minio.license:ro"

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: [.env]
    command: ["python", "-m", "aevra_api.seed"]
    profiles: ["tools"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: [.env]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: [.env]
    environment:
      AEVRA_ENABLE_CELERY: "1"
    command: ["celery", "-A", "services.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    profiles: [workers]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: [.env]
    environment:
      AEVRA_ENABLE_CELERY: "1"
    command: ["celery", "-A", "services.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    profiles: [workers]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      # Browser requests use the Next.js same-origin proxy, so a Cloudflare tunnel
      # exposes the full app instead of only the frontend shell.
      NEXT_PUBLIC_API_URL: /api/v1
    # Port 3000 is frequently occupied by another local development server.
    # Override AEVRA_WEB_PORT when you want a different host port.
    ports: ["127.0.0.1:${AEVRA_WEB_PORT:-3001}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  minio_data:
  aistor_data:
