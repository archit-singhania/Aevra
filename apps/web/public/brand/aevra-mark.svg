<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VAE">
  <!--
    Transparent-ground version of the Nocturne mark, for placing on a page
    rather than in an app tile. Same geometry as public/favicon.svg and
    AevraMark in apps/mobile/lib/widgets/aevra_logo.dart, scaled 2x:
    r = 24.8, circumference 155.82, 40° notch = 17.31.

    `currentColor` on the ring means the arc inherits whatever text colour
    it sits in and so works on both themes; only the tick and the monogram
    are locked to copper.
  -->
  <defs>
    <linearGradient id="aevra-copper" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#e0a87d"/>
      <stop offset="55%" stop-color="#c4855a"/>
      <stop offset="100%" stop-color="#9a5a2e"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="24.8" fill="none"
          stroke="currentColor" stroke-opacity="0.3" stroke-width="4.4"
          stroke-linecap="round" stroke-dasharray="138.51 17.31"/>

  <circle cx="32" cy="32" r="24.8" fill="none"
          stroke="url(#aevra-copper)" stroke-width="4.4"
          stroke-linecap="round" stroke-dasharray="17.31 138.51" stroke-dashoffset="-138.51"/>

  <path d="M21.2 44.4 32 19.6 42.8 44.4" fill="none" stroke="url(#aevra-copper)"
        stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26.8 37.2h10.4" fill="none" stroke="url(#aevra-copper)" stroke-opacity="0.75"
        stroke-width="3.6" stroke-linecap="round"/>
</svg>
