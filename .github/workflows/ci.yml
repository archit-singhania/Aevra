name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy aevra_api
      - run: pytest
      - run: alembic -c ../../alembic.ini upgrade head
        env:
          AEVRA_DATABASE_URL: sqlite:///./ci-migration.db
      - run: alembic -c ../../alembic.ini downgrade base
        env:
          AEVRA_DATABASE_URL: sqlite:///./ci-migration.db
